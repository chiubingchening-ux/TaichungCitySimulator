canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

.scr.on{display:flex}h1{font-size:clamp(28px,6vw,56px);margin:0;letter-spacing:2px}h2{margin:0}
button,select,label.b{background:#1d2b3a;color:var(--fg);border:1px solid #34506d;border-radius:10px;padding:12px 22px;font-size:17px;cursor:pointer}
button:hover{border-color:var(--ac)}button.p{background:var(--ac);color:#04140b;font-weight:700;border:0}
.in{width:100%;padding:10px;border-radius:8px;border:1px solid #34506d;background:#0b1118;color:#e8eef5;font-size:16px;margin:4px 0}.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.card{background:var(--pn);border:1px solid #34506d;border-radius:16px;padding:22px;width:200px;text-align:center;position:relative}
.card.lock{filter:grayscale(1);opacity:.55}.lk{font-size:56px}
.panel{background:var(--pn);border-radius:14px;padding:16px;max-width:900px;width:100%}
#map{max-width:min(560px,90vw);max-height:48vh;border-radius:10px}
#stops{columns:3 160px;font-size:13px;max-height:20vh;overflow:auto;margin:0;padding-left:26px}
#hud{position:fixed;left:0;right:0;top:0;pointer-events:none;display:none;padding:10px;font-size:15px}
#hud .l{display:flex;gap:8px;flex-wrap:wrap}#hud span{background:var(--pn);padding:5px 10px;border-radius:8px}
#spd{position:fixed;right:20px;bottom:20px;font-size:54px;font-weight:800;display:none;text-shadow:0 2px 6px #000}
#mm{inset:auto auto 10px 10px;width:190px;height:190px;display:none;pointer-events:none}#gear{position:fixed;left:14px;bottom:208px;display:none;padding:4px 10px;font-size:18px}#fps{position:fixed;right:12px;top:10px;display:none;background:var(--pn);padding:4px 10px;border-radius:8px;font-size:14px}#touch{display:none;position:fixed;inset:0;pointer-events:none;z-index:5}#touch *{pointer-events:auto;touch-action:none}
.tb{position:fixed;width:58px;height:58px;border-radius:50%;padding:0;font-size:20px;opacity:.75;background:#1d2b3acc;user-select:none;-webkit-user-select:none}
#tl{left:14px;bottom:24px}#tr2{left:84px;bottom:24px}#tg{right:14px;bottom:20px;width:80px;height:80px}#tbk{right:106px;bottom:24px}

#c{touch-action:none}
@media(pointer:coarse){#mm{inset:128px auto auto 8px!important;width:110px!important;height:110px!important}#gear{left:10px!important;bottom:auto!important;top:246px}#spd{right:auto!important;left:50%;bottom:28px!important;top:auto!important;transform:translateX(-50%);font-size:34px!important}#help{display:none!important}}

.on{} .g{opacity:.7;font-size:13px}

const mapCache={};
function drawRouteMap(id){const c=$('map'),x=c.getContext('2d');c.width=560;c.height=460;x.fillStyle='#1d2b3a';x.fillRect(0,0,560,460);const draw=im=>{const r=Math.min(560/im.width,460/im.height);x.fillStyle='#1d2b3a';x.fillRect(0,0,560,460);x.drawImage(im,(560-im.width*r)/2,(460-im.height*r)/2,im.width*r,im.height*r)};if(mapCache[id]){draw(mapCache[id]);return}const im=new Image();im.onload=()=>{mapCache[id]=im;if(RID==id)draw(im)};im.src=MAPIMG[id]}
function pickRoute(id){RID=id;$('rtitle').textContent=id+(id=='920'?' · 豐原 ⇄ 台中':' · 豐原 ⇄ 北屯');$('r920').classList.toggle('p',id=='920');$('r921').classList.toggle('p',id=='921');$('stops').innerHTML=(id=='920'?STOPS_OUT:OUT921).map(n=>'<li>'+n+'</li>').join('');$('rinfo').textContent=T(id=='920'?'routeInfo':'info921');drawRouteMap(id)}
// ---- students, school bell, police lights
function buildStudents(){STU.length=0;SCH.forEach(c=>{for(let k=0;k<8;k++){const o=mkNpc(k%4==3?0x2b4a7a:0xeeeeee);o.g.visible=false;SG.add(o.g);const q=at(c.s+(k%2?55:-55)),sx=q[0]-Math.cos(q[2])*8.8,sz=q[1]+Math.sin(q[2])*8.8;STU.push({g:o.g,sx,sz,ex:c.x,ez:c.z,p:k/8,sp:.04+Math.random()*.03,ph:Math.random()*6})}})}
function studentUpdate(t,dt){const day=V.time>=5&&V.time<20;for(const u of STU){u.p+=dt*u.sp;if(u.p>1)u.p-=1;const near=day&&Math.hypot(u.ex-(V.x||0),u.ez-(V.z||0))<320;u.g.visible=near;if(!near)continue;u.g.position.set(u.sx+(u.ex-u.sx)*u.p,Math.abs(Math.sin(t*8+u.ph))*.05,u.sz+(u.ez-u.sz)*u.p);u.g.rotation.y=Math.atan2(u.ex-u.sx,u.ez-u.sz)}}
let bellT=0;function schoolBell(t){if(t<bellT||!playing||paused)return;for(const c of SCH){const d=Math.hypot(c.x-V.x,c.z-V.z);if(d<170){bellT=t+35;const vv=.012+.03*(1-d/170);[659,523,587,392].forEach((f,j)=>setTimeout(()=>tone(f,1.1,'sine',vv),j*700));return}}}
// ---- accounts: Firebase (Google / Facebook / email) + Claude-account cloud
let FB=null,fbUser=null,CL=null;
const FBCFG=()=>{try{return JSON.parse(localStorage.tc_fbcfg||'null')}catch(e){return null}};
function acMsg(m){$('acMsg').textContent=m||''}
function errTxt(e){const c=(e&&e.code)||'';const m={nocfg:'acNoCfg',blocked:'acBlocked','auth/popup-closed-by-user':'acCancel','auth/cancelled-popup-request':'acCancel','auth/account-exists-with-different-credential':'acExists','auth/invalid-credential':'acBad','auth/wrong-password':'acBad','auth/user-not-found':'acBad','auth/invalid-email':'acBad','auth/email-already-in-use':'acInUse','auth/weak-password':'acBad','auth/network-request-failed':'acNet'}[c];return m?T(m):(c||(e&&e.message)||'error')}
function loadFB(){if(FB)return Promise.resolve(FB);const cfg=FBCFG();if(!cfg||!cfg.apiKey)return Promise.reject({code:'nocfg'});const load=src=>new Promise((ok,no)=>{const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=()=>no({code:'blocked'});document.head.appendChild(sc)});const b='https://www.gstatic.com/firebasejs/10.12.2/';
return load(b+'firebase-app-compat.js').then(()=>load(b+'firebase-auth-compat.js')).then(()=>load(b+'firebase-firestore-compat.js')).then(()=>{firebase.initializeApp(cfg);FB={auth:firebase.auth(),db:firebase.firestore()};FB.auth.onAuthStateChanged(u=>{fbUser=u;renderAcct()});FB.auth.getRedirectResult().catch(e=>acMsg(errTxt(e)));return FB})}
function renderAcct(){let t=fbUser?T('acWho')+(fbUser.displayName||fbUser.email||fbUser.uid)+' ('+((fbUser.providerData[0]||{}).providerId||'')+')':T('acNone');if(CL)t+=' · '+T('acClaude');$('acStatus').textContent=t}
function openAcct(){go('s_acct');renderAcct();$('fbCfg').value=localStorage.tc_fbcfg||'';if(FBCFG())loadFB().catch(e=>acMsg(errTxt(e)))}
function saveCfg(){try{const o=JSON.parse($('fbCfg').value);if(!o||!o.apiKey)throw 0;localStorage.tc_fbcfg=JSON.stringify(o);FB=null;acMsg(T('acCfgOk'));loadFB().catch(e=>acMsg(errTxt(e)))}catch(e){acMsg(T('acCfgBad'))}}
async function popup(mk){try{const f=await loadFB();await f.auth.signInWithPopup(mk())}catch(e){if(FB&&(e.code=='auth/popup-blocked'||e.code=='auth/operation-not-supported-in-this-environment')){try{await FB.auth.signInWithRedirect(mk());return}catch(x){e=x}}acMsg(errTxt(e))}}
function signGoogle(){popup(()=>new firebase.auth.GoogleAuthProvider())}
function signFB(){popup(()=>new firebase.auth.FacebookAuthProvider())}
async function signEmail(reg){const em=$('acEmail').value.trim(),pw=$('acPw').value;if(!em||pw.length<6){acMsg(T('acBad'));return}try{const f=await loadFB();if(reg){const c=await f.auth.createUserWithEmailAndPassword(em,pw);c.user.sendEmailVerification().catch(()=>{})}else await f.auth.signInWithEmailAndPassword(em,pw);$('acPw').value='';acMsg('')}catch(e){acMsg(errTxt(e))}}
async function resetPw(){const em=$('acEmail').value.trim();if(!em)return acMsg(T('acBad'));try{const f=await loadFB();await f.auth.sendPasswordResetEmail(em);acMsg(T('acSent'))}catch(e){acMsg(errTxt(e))}}
async function signOutAll(){try{if(FB)await FB.auth.signOut()}catch(e){}acMsg('')}
const wrapSave=w=>JSON.stringify({magic:'TCSAVE',formatVersion:FMT,exportedAt:Date.now(),name:w.name,checksum:sum(JSON.stringify(w)),data:w});
const cloudCol=()=>fbUser?FB.db.collection('users').doc(fbUser.uid).collection('saves'):CL?CL.d.collection('data/users/'+CL.id):null;
async function cloudUp(){const a=loadAll();if(!a.length)return acMsg(T('none'));const col=cloudCol();if(!col)return acMsg(T('acNeed'));try{for(const w of a)await col.doc(w.id).set({name:w.name,updated:w.updated,json:wrapSave(w)});acMsg(T('acUpOk').replace('{n}',a.length))}catch(e){acMsg(errTxt(e))}}
async function cloudDown(){const col=cloudCol();if(!col)return acMsg(T('acNeed'));try{const q=await col.get(),a=loadAll();let n=0;for(const d of q.docs){try{const w=validate(JSON.parse(d.data().json)),i=a.findIndex(x=>x.id==w.id);if(i>=0){if(a[i].updated>=w.updated)continue;if(!confirm(T('acNewer').replace('{n}',w.name)))continue;a[i]=w}else a.unshift(w);n++}catch(e){}}putAll(a);renderSaves();acMsg(T('acDownOk').replace('{n}',n))}catch(e){acMsg(errTxt(e))}}
(async()=>{try{if(window.claude&&claude.use){const u=await claude.use('user'),d=await claude.use('db');if(u&&d&&u.id){const id=await u.id();if(id){CL={u,d,id};renderAcct()}}}}catch(e){}})();
ui();
</script></body></html>
