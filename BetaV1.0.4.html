<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{--bg:#0b1118;--fg:#e8eef5;--ac:#27c36b;--pn:#16202bcc}
@media(prefers-color-scheme:light){:root{--bg:#0b1118}}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Noto Sans TC",sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;background:linear-gradient(#0b1118cc,#0b1118ee);overflow:auto}
.scr.on{display:flex}h1{font-size:clamp(28px,6vw,56px);margin:0;letter-spacing:2px}h2{margin:0}
button,select,label.b{background:#1d2b3a;color:var(--fg);border:1px solid #34506d;border-radius:10px;padding:12px 22px;font-size:17px;cursor:pointer}
button:hover{border-color:var(--ac)}button.p{background:var(--ac);color:#04140b;font-weight:700;border:0}
.sl{position:absolute;height:2px;left:-40%;width:40%;background:linear-gradient(90deg,transparent,#7fe3ff,transparent);animation:islide 1.4s linear infinite}@keyframes islide{to{left:120%}}
#intro{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 38%,#12304a 0,#060b11 72%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .9s,transform .9s;overflow:hidden}#intro.out{opacity:0;transform:scale(1.3);pointer-events:none}
#intro img{width:min(52vw,320px);height:auto;animation:ipop 1.4s cubic-bezier(.2,1.4,.3,1) both,iglow 2.4s ease-in-out 1.4s infinite}@keyframes ipop{from{transform:scale(.2) rotate(-40deg);opacity:0;filter:blur(18px)}to{transform:none;opacity:1}}@keyframes iglow{50%{filter:drop-shadow(0 0 30px #3ee38a)}}
.tt{font-size:clamp(28px,7vw,54px);font-weight:800;letter-spacing:4px}.tt span{display:inline-block;opacity:0;transform:translateY(30px);animation:iup .6s forwards}@keyframes iup{to{opacity:1;transform:none}}
#isub{opacity:0;animation:iup .6s 1.8s forwards;color:#9fb6c8;letter-spacing:3px}#ibar{width:min(60vw,340px);height:6px;border-radius:3px;background:#ffffff22;overflow:hidden}#ibar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#27c36b,#3ec8ff);animation:ifill 2.4s ease-out forwards}@keyframes ifill{to{width:100%}}
#itap{opacity:0;animation:iup .6s 2.6s forwards,ipulse 1.6s 3.2s infinite;letter-spacing:2px}@keyframes ipulse{50%{opacity:.35}}
.logo{width:min(46vw,300px);height:auto;filter:drop-shadow(0 6px 16px #000a)}#s_home h1{font-size:clamp(22px,4.5vw,38px)}.in{width:100%;padding:10px;border-radius:8px;border:1px solid #34506d;background:#0b1118;color:#e8eef5;font-size:16px;margin:4px 0}.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.card{background:var(--pn);border:1px solid #34506d;border-radius:16px;padding:22px;width:200px;text-align:center;position:relative}
.card.lock{filter:grayscale(1);opacity:.55}.lk{font-size:56px}
.panel{background:var(--pn);border-radius:14px;padding:16px;max-width:900px;width:100%}
#map{max-width:min(560px,90vw);max-height:48vh;border-radius:10px}
#stops{columns:3 160px;font-size:13px;max-height:20vh;overflow:auto;margin:0;padding-left:26px}
#hud{position:fixed;left:0;right:0;top:0;pointer-events:none;display:none;padding:10px;font-size:15px}
#hud .l{display:flex;gap:8px;flex-wrap:wrap}#hud span{background:var(--pn);padding:5px 10px;border-radius:8px}

// ---- students, school bell, police lights
function buildStudents(){STU.length=0;SCH.forEach(c=>{for(let k=0;k<8;k++){const o=mkNpc(k%4==3?0x2b4a7a:0xeeeeee);o.g.visible=false;SG.add(o.g);const q=at(c.s+(k%2?55:-55)),sx=q[0]-Math.cos(q[2])*12.4,sz=q[1]+Math.sin(q[2])*12.4;STU.push({g:o.g,sx,sz,ex:c.x,ez:c.z,p:k/8,sp:.04+Math.random()*.03,ph:Math.random()*6})}})}
function studentUpdate(t,dt){const day=V.time>=5&&V.time<20;for(const u of STU){u.p+=dt*u.sp;if(u.p>1)u.p-=1;const near=day&&Math.hypot(u.ex-(V.x||0),u.ez-(V.z||0))<320;u.g.visible=near;if(!near)continue;u.g.position.set(u.sx+(u.ex-u.sx)*u.p,Math.abs(Math.sin(t*8+u.ph))*.05,u.sz+(u.ez-u.sz)*u.p);u.g.rotation.y=Math.atan2(u.ex-u.sx,u.ez-u.sz)}}
let bellT=0;function schoolBell(t){if(t<bellT||!playing||paused)return;for(const c of SCH){const d=Math.hypot(c.x-V.x,c.z-V.z);if(d<260){bellT=t+30;const vv=.06+.14*(1-d/260);toast('🔔 '+c.nm);[659,523,587,392].forEach((f,j)=>setTimeout(()=>{tone(f,2.2,'sine',vv);tone(f*2.76,1.2,'sine',vv*.35);tone(f/2,2.2,'sine',vv*.3)},j*800));return}}}
